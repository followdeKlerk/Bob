name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Install mobile dependencies used by cross-component tests
        run: npm ci --prefix apps/mobile
      - run: npm run build
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Backend tests (includes documentation, repository hygiene and prompt provenance)
        # Bound parallel browser/runtime fixtures on shared hosted runners.
        run: node --import tsx --import ./test/environment.mjs --test --test-concurrency=2 test/*.test.ts
      - name: Verify reproducible prompt port
        run: python3 assets/learning/port.py --check
      - name: Inspect package contents and shipped guide links
        run: node tools/check-package.mjs

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - name: Build shared workspace contracts
        run: npm run build
      - name: Mobile tests
        working-directory: apps/mobile
        run: npm test -- --runInBand
      - name: Mobile typecheck
        working-directory: apps/mobile
        run: ../../node_modules/.bin/tsc --noEmit
