name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Backend tests (includes documentation, repository hygiene and prompt provenance)
        run: npm test
      - name: Verify reproducible prompt port
        run: python3 assets/learning/port.py --check
      - name: Inspect package contents and shipped guide links
        run: node tools/check-package.mjs

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - name: Mobile tests
        working-directory: apps/mobile
        run: npm test -- --runInBand
      - name: Mobile typecheck
        working-directory: apps/mobile
        run: ../../node_modules/.bin/tsc --noEmit
