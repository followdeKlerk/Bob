# Bound native ML pools: two-bank recall already parallelizes requests.
# Keep the existing reranker model; bound mid-budget candidates to 100.
# High budget retains its default 300-candidate cap for deeper searches.
[Service]
Environment=OMP_NUM_THREADS=2
Environment=MKL_NUM_THREADS=2
Environment=OPENBLAS_NUM_THREADS=2
Environment=NUMEXPR_NUM_THREADS=2
Environment=HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT=2
Environment=HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING=true
Environment=HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID=100
